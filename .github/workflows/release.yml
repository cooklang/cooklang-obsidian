name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  release-please:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5

      # Another push may finish first and create the release from this run.
      # Build the tagged commit instead of reusing this run's earlier build.
      - name: Check out release commit
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: Set up Node.js
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: npm ci

      - name: Validate release commit
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Verify release version
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: node -e 'const fs = require("node:fs"); const version = JSON.parse(fs.readFileSync("manifest.json", "utf8")).version; if (version !== process.env.TAG) throw new Error(`manifest version ${version} does not match release tag ${process.env.TAG}`);'

      - name: Package release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
          REPO: ${{ github.event.repository.name }}
        run: |
          mkdir "$REPO"
          cp main.js manifest.json styles.css README.md "$REPO/"
          zip -r "$REPO-${TAG}.zip" "$REPO"

      - name: Upload release assets
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
          REPO: ${{ github.event.repository.name }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            main.js \
            manifest.json \
            styles.css \
            "$REPO-${TAG}.zip" \
            --clobber
