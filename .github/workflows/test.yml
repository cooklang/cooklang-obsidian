name: Test

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          helpURL: https://github.com/googleapis/release-please-action#how-should-i-write-my-commits

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
