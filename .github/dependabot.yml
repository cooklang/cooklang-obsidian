# Dependabot configuration
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # ---- Node ----
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
    open-pull-requests-limit: 5
    ignore:
      # obsidian pins these as exact peer dependencies; keep them in lockstep.
      - dependency-name: "@codemirror/state"
      - dependency-name: "@codemirror/view"
      # Keep @types/node on the Node major we target (engines: >=24 <25).
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ---- GitHub Actions ----
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
